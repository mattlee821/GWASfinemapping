<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-label="Comparison of LD match regimes and MultiSuSiE resolution across 8 pQTL models">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .lbl { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
      .lbl-sm { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
      .val { font: 700 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3,3; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="4" y="4" width="972" height="472" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: Panel A - CS Recovery Across LD Regimes -->
  <text x="28" y="34" class="title">A. Active cis Credible-Set Recovery by LD Regime</text>
  <text x="28" y="52" class="sub">Standard SuSiE-RSS (slate) vs Mismatch-Aware SuSiE-rRSS / MultiSuSiE (teal/indigo)</text>

  <!-- Gridlines X: 0%, 25%, 50%, 75%, 100% mapped from x=195 to x=455 (width 260) -->
  <line x1="195" y1="74" x2="195" y2="415" class="axis"/>
  <line x1="260" y1="74" x2="260" y2="415" class="grid"/>
  <line x1="325" y1="74" x2="325" y2="415" class="grid"/>
  <line x1="390" y1="74" x2="390" y2="415" class="grid"/>
  <line x1="455" y1="74" x2="455" y2="415" class="grid"/>

  <text x="195" y="432" text-anchor="middle" class="lbl-sm">0%</text>
  <text x="260" y="432" text-anchor="middle" class="lbl-sm">25%</text>
  <text x="325" y="432" text-anchor="middle" class="lbl-sm">50%</text>
  <text x="390" y="432" text-anchor="middle" class="lbl-sm">75%</text>
  <text x="455" y="432" text-anchor="middle" class="lbl-sm">100%</text>

  <!-- Row 1: Sun EUR (Olink) RSS 87.1% (226px), rRSS 96.8% (252px) -->
  <text x="187" y="96" text-anchor="end" class="lbl">Sun EUR (Olink)</text>
  <text x="187" y="110" text-anchor="end" class="lbl-sm">In-sample EUR (31)</text>
  <rect x="195" y="84" width="226" height="12" rx="3" fill="#94a3b8"/>
  <rect x="195" y="99" width="252" height="12" rx="3" fill="#0d9488"/>
  <text x="461" y="109" class="val">96.8% (30/31)</text>

  <!-- Row 2: Sun ALL (Olink) RSS 43.3% (113px), rRSS 76.7% (199px) -->
  <text x="187" y="145" text-anchor="end" class="lbl">Sun ALL (Olink)</text>
  <text x="187" y="159" text-anchor="end" class="lbl-sm">ALL vs EUR LD (30)</text>
  <rect x="195" y="133" width="113" height="12" rx="3" fill="#cbd5e1"/>
  <rect x="195" y="148" width="199" height="12" rx="3" fill="#f59e0b"/>
  <text x="400" y="144" class="lbl-sm">RSS: 43%</text>
  <text x="400" y="159" class="val">76.7% (9 V&gt;1)</text>

  <!-- Row 3: Pietzner EUR RSS 85.7% (223px), rRSS 100% (260px) -->
  <text x="187" y="194" text-anchor="end" class="lbl">Pietzner (Fenland)</text>
  <text x="187" y="208" text-anchor="end" class="lbl-sm">UK EUR Soma (14)</text>
  <rect x="195" y="182" width="223" height="12" rx="3" fill="#94a3b8"/>
  <rect x="195" y="197" width="260" height="12" rx="3" fill="#0d9488"/>
  <text x="461" y="207" class="val">100% (14/14)</text>

  <!-- Row 4: Zhang EUR RSS 100%, rRSS 100% -->
  <text x="187" y="243" text-anchor="end" class="lbl">Zhang EUR (ARIC)</text>
  <text x="187" y="257" text-anchor="end" class="lbl-sm">US EUR Soma (12)</text>
  <rect x="195" y="231" width="260" height="12" rx="3" fill="#94a3b8"/>
  <rect x="195" y="246" width="260" height="12" rx="3" fill="#0d9488"/>
  <text x="461" y="256" class="val">100% (12/12)</text>

  <!-- Row 5: Zhang AFR RSS 100%, rRSS 100% -->
  <text x="187" y="292" text-anchor="end" class="lbl">Zhang AFR (ARIC)</text>
  <text x="187" y="306" text-anchor="end" class="lbl-sm">AFR / Pan-UKB AFR (10)</text>
  <rect x="195" y="280" width="260" height="12" rx="3" fill="#94a3b8"/>
  <rect x="195" y="295" width="260" height="12" rx="3" fill="#0d9488"/>
  <text x="461" y="305" class="val">100% (10/10)</text>

  <!-- Row 6: Ferkingstad Iceland RSS 42.9% (112px), rRSS 78.6% (204px) -->
  <text x="187" y="341" text-anchor="end" class="lbl">Ferkingstad (deCODE)</text>
  <text x="187" y="355" text-anchor="end" class="lbl-sm">Founder vs UK LD (14)</text>
  <rect x="195" y="329" width="112" height="12" rx="3" fill="#cbd5e1"/>
  <rect x="195" y="344" width="204" height="12" rx="3" fill="#f59e0b"/>
  <text x="405" y="340" class="lbl-sm">RSS: 43%</text>
  <text x="405" y="355" class="val">78.6% (5 V&gt;1)</text>

  <!-- Row 7: MultiSuSiE 3-Cohort 100% convergence (26/26) -->
  <text x="187" y="390" text-anchor="end" class="lbl">MultiSuSiE 3-Cohort</text>
  <text x="187" y="404" text-anchor="end" class="lbl-sm">Pietz+Z_EUR+Z_AFR (26)</text>
  <rect x="195" y="384" width="260" height="18" rx="4" fill="#4f46e5"/>
  <text x="461" y="398" class="val">100% Conv (0 V&gt;1)</text>

  <!-- Divider -->
  <line x1="542" y1="24" x2="542" y2="452" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Right Panel: Panel B - SomaScan Single-Cohort vs MultiSuSiE Resolution -->
  <text x="564" y="34" class="title">B. SomaScan Resolution: Single-Cohort vs MultiSuSiE</text>
  <text x="564" y="52" class="sub">Total cis 95% credible sets (light) and 1-SNP causal resolution (solid)</text>

  <!-- Y axis from y=395 (0 CS) to y=95 (85 CS) -> scale = 3.5 px per CS -->
  <line x1="595" y1="95" x2="595" y2="395" class="axis"/>
  <line x1="595" y1="395" x2="948" y2="395" class="axis"/>
  <line x1="595" y1="325" x2="948" y2="325" class="grid"/>
  <line x1="595" y1="255" x2="948" y2="255" class="grid"/>
  <line x1="595" y1="185" x2="948" y2="185" class="grid"/>
  <line x1="595" y1="115" x2="948" y2="115" class="grid"/>

  <text x="588" y="399" text-anchor="end" class="lbl-sm">0</text>
  <text x="588" y="329" text-anchor="end" class="lbl-sm">20</text>
  <text x="588" y="259" text-anchor="end" class="lbl-sm">40</text>
  <text x="588" y="189" text-anchor="end" class="lbl-sm">60</text>
  <text x="588" y="119" text-anchor="end" class="lbl-sm">80</text>

  <!-- Bar group 1: Zhang AFR (16 total = 56px, 6 1-SNP = 21px) -->
  <rect x="615" y="339" width="44" height="56" rx="4" fill="#cbd5e1"/>
  <rect x="615" y="374" width="44" height="21" rx="4" fill="#0d9488"/>
  <text x="637" y="332" text-anchor="middle" class="val">16</text>
  <text x="637" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">6</text>
  <text x="637" y="413" text-anchor="middle" class="lbl">Zhang</text>
  <text x="637" y="427" text-anchor="middle" class="lbl-sm">AFR (1.9k)</text>

  <!-- Bar group 2: Zhang EUR (26 total = 91px, 11 1-SNP = 38.5px) -->
  <rect x="683" y="304" width="44" height="91" rx="4" fill="#cbd5e1"/>
  <rect x="683" y="356.5" width="44" height="38.5" rx="4" fill="#0d9488"/>
  <text x="705" y="297" text-anchor="middle" class="val">26</text>
  <text x="705" y="381" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">11</text>
  <text x="705" y="413" text-anchor="middle" class="lbl">Zhang</text>
  <text x="705" y="427" text-anchor="middle" class="lbl-sm">EUR (7.2k)</text>

  <!-- Bar group 3: Pietzner EUR (43 total = 150.5px, 14 1-SNP = 49px) -->
  <rect x="751" y="244.5" width="44" height="150.5" rx="4" fill="#cbd5e1"/>
  <rect x="751" y="346" width="44" height="49" rx="4" fill="#0d9488"/>
  <text x="773" y="237" text-anchor="middle" class="val">43</text>
  <text x="773" y="375" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">14</text>
  <text x="773" y="413" text-anchor="middle" class="lbl">Pietzner</text>
  <text x="773" y="427" text-anchor="middle" class="lbl-sm">EUR (10.7k)</text>

  <!-- Bar group 4: MultiSuSiE 3-Cohort (77 total = 269.5px, 30 1-SNP = 105px) -->
  <rect x="822" y="125.5" width="52" height="269.5" rx="4" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="822" y="290" width="52" height="105" rx="4" fill="#4f46e5"/>
  <text x="848" y="116" text-anchor="middle" class="val" fill="#3730a3">77 (+79%)</text>
  <text x="848" y="347" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">30 (1-SNP)</text>
  <text x="848" y="413" text-anchor="middle" class="lbl" fill="#3730a3">MSuSiE-3</text>
  <text x="848" y="427" text-anchor="middle" class="lbl-sm">Recommended</text>

  <!-- Bar group 5: MultiSuSiE 4-Cohort (69 total = 241.5px, 38 1-SNP = 133px) -->
  <rect x="894" y="153.5" width="44" height="241.5" rx="4" fill="#fde68a"/>
  <rect x="894" y="262" width="44" height="133" rx="4" fill="#d97706"/>
  <text x="916" y="146" text-anchor="middle" class="val">69*</text>
  <text x="916" y="333" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">38</text>
  <text x="916" y="413" text-anchor="middle" class="lbl">MSuSiE-4</text>
  <text x="916" y="427" text-anchor="middle" class="lbl-sm">+deCODE*</text>

  <text x="564" y="456" class="lbl-sm">*MSuSiE-3 rescues CXCL8 (PPH4=0.89) &amp; TFF2 (PPH4 0.54-&gt;1.00) with 0/11 null false positives; +deCODE imports 4 founder-LD V&gt;1 drops.</text>
</svg>
